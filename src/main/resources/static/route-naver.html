<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>휠체어 경로 확인 (네이버)</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: "맑은 고딕", sans-serif; }
        #map { width: 100%; height: 100%; }

        #panel {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            width: 300px; padding: 14px 16px;
            background: rgba(255, 255, 255, .96);
            border-radius: 8px; box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
            font-size: 13px; line-height: 1.6;
        }
        #panel h1 { margin: 0 0 8px; font-size: 15px; }
        #panel .hint { color: #555; margin-bottom: 10px; }
        #panel .row { display: flex; justify-content: space-between; }
        #panel .row span:last-child { font-weight: bold; }
        #panel hr { border: 0; border-top: 1px solid #e3e3e3; margin: 10px 0; }
        #panel label { display: block; cursor: pointer; }
        #panel button {
            padding: 7px; margin-top: 8px; cursor: pointer;
            border: 1px solid #c4c4c4; background: #f6f6f6; border-radius: 5px; font-size: 13px;
        }
        #panel .btns { display: flex; gap: 6px; }
        #panel .btns button { flex: 1; }
        #panel a { color: #1565c0; font-size: 12px; }

        #status { padding: 6px 8px; border-radius: 5px; margin-bottom: 8px; }
        .ok   { background: #e8f5e9; color: #1b5e20; }
        .fail { background: #ffebee; color: #b71c1c; }
        .wait { background: #f2f2f2; color: #555; }

        .legend i { display: inline-block; width: 22px; height: 4px; vertical-align: middle; margin-right: 6px; }
        .legend i.dot { width: 12px; height: 12px; border-radius: 50%; }

        .pin {
            padding: 2px 8px; border-radius: 4px; color: #fff;
            font-size: 12px; font-weight: bold; white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
        }
        .zone {
            width: 14px; height: 14px; border-radius: 50%;
            background: #ff9800; border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
        }
    </style>
</head>
<body>

<div id="panel">
    <h1>휠체어 경로 확인 — 네이버</h1>
    <div class="hint">
        지도를 클릭해 <b>출발</b> → <b>도착</b> 순으로 찍으세요.<br>
        <a href="/route.html" target="_blank">카카오 화면 ↗</a>
        · <a href="/admin.html" target="_blank">공사구간 수정 ↗</a>
    </div>

    <div id="status" class="wait">지도를 불러오는 중…</div>

    <div id="result" style="display:none">
        <div class="row"><span>총 거리</span><span id="r-dist">-</span></div>
        <div class="row"><span>지나는 엣지</span><span id="r-edges">-</span></div>
        <div class="row"><span>탐색 방문 노드</span><span id="r-visited">-</span></div>
        <div class="row"><span>계산 시간</span><span id="r-ms">-</span></div>
        <div class="row"><span>스냅(출발/도착)</span><span id="r-snap">-</span></div>
    </div>

    <div class="btns">
        <button id="sample">예시 경로</button>
        <button id="reset">초기화</button>
    </div>

    <hr>

    <label class="legend"><input type="checkbox" id="t-construction" checked>
        <i style="background:#ff9800"></i>공사구간 <span id="c-construction"></span></label>
    <label class="legend" style="margin-left:22px; color:#555">
        <input type="checkbox" id="t-conline" checked>선으로 표시 (끄면 점만)</label>
    <label class="legend"><input type="checkbox" id="t-blocked">
        <i style="background:#e53935"></i>차단된 엣지 <span id="c-blocked"></span></label>
    <label class="legend"><input type="checkbox" id="t-steps">
        <i style="background:#7e57c2"></i>계단 <span id="c-steps"></span></label>

    <hr>
    <div id="meta" style="color:#666; font-size:12px"></div>
</div>

<div id="map"></div>

<script>
    /*
     * 카카오 화면(route.html)과 같은 데이터를 같은 방식으로 그려서, 어느 지도가 실제와
     * 더 잘 맞는지 눈으로 비교하기 위한 화면이다. 서버 API 는 좌표만 주고받으므로 그대로 쓴다.
     *
     * 수정 모드는 넣지 않았다. 비교가 목적이라 필요 없고, 좌표 수정은 카카오 화면에서 하면 된다.
     */
    // wheelway.region-id 와 맞춰야 한다.
    /*
      지도를 처음 띄울 자리와 [예시 경로] 가 쓰는 두 점.

      ★ 중심은 박아두지 않는다. region-id 를 바꾸면 서버가 주는 bounds 도 같이 바뀌는데,
      중심만 남아 있으면 열자마자 데이터가 없는 곳이 뜬다.

      예시 두 점은 bounds 로 만들 수 없어서(가운데 한 점밖에 안 나온다) 지역별로 적어 둔다.
      맞지 않는 지역으로 갈아타면 [예시 경로] 가 '경로없음' 을 낼 텐데, 그건 이 표를
      갈아끼우라는 신호다 — 화면 중심이 엉뚱한 곳에 뜨는 것보다 원인이 분명하다.
    */
    const CENTER_FALLBACK = [37.5663, 126.9779];   // 서울시청. bounds 를 못 받았을 때만
    let serviceBounds = null;                      // /api/config 가 준다

    const SAMPLES = {
        'seoul-junggu':   { from: [37.5663, 126.9779], to: [37.5633, 126.9873] },  // 시청 → 명동성당
        'chungbuk-boeun': { from: [36.4894, 127.7295], to: [36.4930, 127.7400] },  // 보은읍 중심가
        'chungbuk-cheongju': { from: [36.6424, 127.4890], to: [36.6360, 127.4900] } // 청주시청 → 성안길
    };
    let regionId = null;

    function initialCenter() {
        if (!serviceBounds) {
            return CENTER_FALLBACK;
        }
        const [minLat, minLng, maxLat, maxLng] = serviceBounds;
        return [(minLat + maxLat) / 2, (minLng + maxLng) / 2];
    }

    /** 지금 지역의 예시 두 점. 표에 없는 지역이면 null 이고, [예시 경로] 는 그렇다고 말한다. */
    function samplePoints() {
        return SAMPLES[regionId] || null;
    }

    let map;
    let start = null, end = null;
    let startPin = null, endPin = null, routeLine = null;

    const overlays = { construction: [], constructionLine: [], blocked: [], steps: [] };
    const loaded = { construction: false, blocked: false, steps: false };

    const $ = (id) => document.getElementById(id);

    function setStatus(text, cls) {
        const el = $('status');
        el.textContent = text;
        el.className = cls;
    }

    async function boot() {
        const cfg = await fetch('/api/config').then(r => r.json());

        if (!cfg.naverClientId) {
            setStatus('네이버 클라이언트 ID 가 없습니다. credentials/api_keys.properties 의 naver.client-id 를 채우세요.', 'fail');
            return;
        }

        serviceBounds = cfg.bounds;
        regionId = cfg.regionId;
        $('meta').textContent = `${cfg.regionId} · 노드 ${cfg.nodeCount.toLocaleString()}`
            + ` · 엣지 ${cfg.edgeCount.toLocaleString()} · 차단 ${cfg.blockedCount.toLocaleString()}`;
        // 지역은 서버가 정한다. 제목에 박아두면 region-id 를 바꿨을 때 거짓말이 된다.
        document.title = `휠체어 경로 확인 (네이버) — ${cfg.regionId}`;

        // NCP 는 최근 파라미터 이름을 ncpKeyId 로 바꿨는데 기존 문서·앱은 ncpClientId 를 쓴다.
        // 어느 쪽이 맞는지 발급 시점에 따라 갈리므로 순서대로 시도한다.
        loadSdk(cfg.naverClientId, ['ncpKeyId', 'ncpClientId']);
    }

    function loadSdk(clientId, paramNames) {
        if (paramNames.length === 0) {
            setStatus('지도 SDK 를 불러오지 못했습니다. 클라이언트 ID 와 서비스 URL 등록을 확인하세요.', 'fail');
            return;
        }
        const param = paramNames[0];
        const s = document.createElement('script');
        s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?${param}=${clientId}`;
        s.onerror = () => loadSdk(clientId, paramNames.slice(1));
        s.onload = () => {
            if (typeof naver === 'undefined' || !naver.maps) {
                loadSdk(clientId, paramNames.slice(1));
                return;
            }
            console.log('네이버 지도 SDK 로드 성공 — 파라미터:', param);
            initMap();
        };
        document.head.appendChild(s);
    }

    function initMap() {
        // 네이버는 zoom(클수록 확대), 카카오는 level(작을수록 확대). 카카오 level 5 와 비슷한 배율이 zoom 16 이다.
        map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(...initialCenter()),
            zoom: 16
        });

        naver.maps.Event.addListener(map, 'click', (e) => onMapClick(e.coord));

        setStatus('출발지를 클릭하세요.', 'wait');
        toggleOverlay('construction');
    }

    function onMapClick(latLng) {
        if (start && end) {
            reset();
        }

        if (!start) {
            start = latLng;
            startPin = placePin(latLng, '출발', '#2e7d32');
            setStatus('도착지를 클릭하세요.', 'wait');
        } else {
            end = latLng;
            endPin = placePin(latLng, '도착', '#c62828');
            search();
        }
    }

    /** 기본 마커 대신 HTML 마커를 쓴다. clickable:false 라 지도 클릭을 막지 않는다. */
    function placePin(latLng, text, color) {
        return new naver.maps.Marker({
            position: latLng, map: map, clickable: false, zIndex: 5,
            icon: {
                content: `<div class="pin" style="background:${color}">${text}</div>`,
                anchor: new naver.maps.Point(20, 26)
            }
        });
    }

    async function search() {
        setStatus('경로를 계산하는 중…', 'wait');

        const url = `/api/route?startLat=${start.lat()}&startLng=${start.lng()}`
            + `&endLat=${end.lat()}&endLng=${end.lng()}`;

        let res;
        try {
            res = await fetch(url).then(r => r.json());
        } catch (e) {
            setStatus('서버 요청 실패: ' + e.message, 'fail');
            return;
        }

        if (res.resultStatus !== '성공') {
            setStatus(`${res.resultStatus} — ${res.message ?? ''}`, 'fail');
            $('result').style.display = 'none';
            return;
        }

        const points = res.path.map(p => new naver.maps.LatLng(p[0], p[1]));

        routeLine = new naver.maps.Polyline({
            map: map, path: points,
            strokeColor: '#1565c0', strokeWeight: 7, strokeOpacity: 0.95, zIndex: 4
        });

        setStatus('경로를 찾았습니다.', 'ok');
        $('result').style.display = 'block';
        $('r-dist').textContent = `${Math.round(res.distanceM).toLocaleString()} m`;
        $('r-edges').textContent = `${res.edgeIds.length} 개`;
        $('r-visited').textContent = `${res.visitedNodes.toLocaleString()} 개`;
        $('r-ms').textContent = `${res.durationMs} ms`;
        $('r-snap').textContent = `${res.startSnapM.toFixed(1)} / ${res.endSnapM.toFixed(1)} m`;

        fitTo(res.path);
    }

    /** 네이버 LatLngBounds 는 남서·북동 두 점으로 만든다. */
    function fitTo(path) {
        const lats = path.map(p => p[0]);
        const lngs = path.map(p => p[1]);
        map.fitBounds(new naver.maps.LatLngBounds(
                new naver.maps.LatLng(Math.min(...lats), Math.min(...lngs)),
                new naver.maps.LatLng(Math.max(...lats), Math.max(...lngs))));
    }

    function sampleRoute() {
        reset();
        const p = samplePoints();
        if (!p) {
            setStatus(`이 지역(${regionId})의 예시 좌표가 없습니다. SAMPLES 에 추가하세요.`, 'fail');
            return;
        }
        start = new naver.maps.LatLng(p.from[0], p.from[1]);
        end = new naver.maps.LatLng(p.to[0], p.to[1]);
        startPin = placePin(start, '출발', '#2e7d32');
        endPin = placePin(end, '도착', '#c62828');
        search();
    }

    function reset() {
        [startPin, endPin, routeLine].forEach(o => o && o.setMap(null));
        start = end = startPin = endPin = routeLine = null;
        $('result').style.display = 'none';
        setStatus('출발지를 클릭하세요.', 'wait');
    }

    // ------------------------------------------------------------ 오버레이

    async function toggleOverlay(kind) {
        const on = $(`t-${kind}`).checked;

        if (on && !loaded[kind]) {
            await loadOverlay(kind);
            loaded[kind] = true;
        }
        overlays[kind].forEach(o => o.setMap(on ? map : null));

        if (kind === 'construction') {
            applyConstructionLines();
        }
    }

    function applyConstructionLines() {
        const on = $('t-construction').checked && $('t-conline').checked;
        overlays.constructionLine.forEach(o => o.setMap(on ? map : null));
    }

    async function loadOverlay(kind) {
        if (kind === 'construction') {
            const zones = await fetch('/api/overlay/construction').then(r => r.json());
            let lineCount = 0;

            zones.forEach(z => {
                (z.segments || []).forEach(s => {
                    overlays.constructionLine.push(makeLine(s, '#ff9800', 7));
                    lineCount++;
                });

                const until = z.endDate ? `${z.endDate} 까지` : '종료일 미정';
                overlays.construction.push(new naver.maps.Marker({
                    position: new naver.maps.LatLng(z.latitude, z.longitude),
                    clickable: false, zIndex: 3,
                    icon: {
                        content: `<div class="zone" title="${escapeHtml(z.name)}\n${until} 통행 불가\n공사구간: ${escapeHtml(z.roadSegment)}"></div>`,
                        anchor: new naver.maps.Point(7, 7)
                    }
                }));

            });
            $('c-construction').textContent = `(${zones.length}건 · 구간 ${lineCount})`;

        } else if (kind === 'blocked') {
            const segs = await fetch('/api/overlay/blocked').then(r => r.json());
            segs.forEach(s => overlays.blocked.push(makeLine(s, '#e53935', 5)));
            $('c-blocked').textContent = `(${segs.length})`;

        } else if (kind === 'steps') {
            const raw = await fetch('/api/overlay/steps').then(r => r.json());
            raw.forEach(json => overlays.steps.push(makeLine(JSON.parse(json), '#7e57c2', 4)));
            $('c-steps').textContent = `(${raw.length})`;
        }
    }

    function makeLine(coords, color, weight) {
        return new naver.maps.Polyline({
            path: coords.map(c => new naver.maps.LatLng(c[0], c[1])),
            strokeColor: color, strokeWeight: weight, strokeOpacity: 0.8, zIndex: 1
        });
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    ['construction', 'blocked', 'steps'].forEach(kind =>
        $(`t-${kind}`).addEventListener('change', () => toggleOverlay(kind)));
    $('t-conline').addEventListener('change', applyConstructionLines);
    $('reset').addEventListener('click', reset);
    $('sample').addEventListener('click', sampleRoute);

    boot();
</script>
</body>
</html>
