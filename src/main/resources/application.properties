spring.application.name=wheelway

# MariaDB Connection info
# password 는 credentials/api_keys.properties 에 있다 (맨 아래 import 참고)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.89.129:3306/wheelway
spring.datasource.username=wheel

# JSP 뷰
# 컨트롤러가 돌려주는 뷰 이름 앞뒤에 이 값이 붙는다.
#   "user/signup"  →  /WEB-INF/views/user/signup.jsp
# 이 두 줄이 없으면 스프링이 뷰 이름을 URL 경로로 해석해 Circular view path 500 이 난다.
# 화면 파일은 src/main/webapp/WEB-INF/views/ 아래에 둔다(정적 HTML 은 계속 static/ 이다).
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis
mybatis.type-aliases-package=kopo.poly.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 그래프 설정
# region-id : 지역 서브그래프 키. OsmGraphLoader 로 적재한 값과 반드시 같아야 한다
# snap-max-m: 출발/도착 좌표에서 이 거리 안에 노드가 없으면 '경로없음'으로 본다.
#             건물 한가운데나 강 위를 찍었을 때 엉뚱하게 먼 노드로 붙는 것을 막는다
# block-radius-m: 공사구간·제보 좌표 하나가 반경 몇 m 안의 엣지를 막을지 — 기본값.
#             공사구간은 CONSTRUCTION_ZONES.BLOCK_RADIUS_M, 제보는 OBSTACLE_REPORTS.BLOCK_RADIUS_M
#             으로 행마다 덮어쓸 수 있고, 값이 없을 때만 이 값을 쓴다.
#             좁으면 놓치고(반경 안에 보도가 없어 무시됨) 넓으면 멀쩡한 골목까지 막힌다
# report-max-radius-m: 제보가 지정할 수 있는 반경의 상한. 서버가 강제한다.
#             높음 제보는 등록 즉시 하드필터에 들어가므로, 상한이 없으면 제보 한 건으로
#             일대의 보도가 통째로 막힌다. 사용자 화면은 미터를 직접 묻지 않고
#             '여기 한 곳(5) / 이 구간(15) / 넓게(30)' 셋 중 하나를 보내지만,
#             화면 값을 그대로 믿지 않고 여기서 다시 검사한다.
#             넘는 값은 잘라 담지 않고 거절한다 — 조용히 줄이면 넣은 값과 실제가 어긋난다
# region-id: 서비스가 볼 지역 서브그래프. NODES/EDGES 는 지역별로 나란히 들어 있으므로
#             이 한 줄만 바꾸면 재적재 없이 지역을 갈아탄다.
#             seoul-junggu    노드 32,758 / 엣지  70,624 — 공사 57건, MANUAL_EDGES 4건
#             chungbuk-boeun  노드 69,864 / 엣지 142,026 — 공사 0건 (중구 좌표라 REGION_ID 로 걸러짐)
#             chungbuk-cheongju 노드 64,549 / 엣지 142,450 — 청주 도심 bbox(36.600,127.410,36.680,127.520)
#                             보도 footway 1,497 · pedestrian 59 (보은읍은 0). 연결성 96.0%
wheelway.region-id=chungbuk-cheongju
wheelway.snap-max-m=300
wheelway.block-radius-m=5
wheelway.report-max-radius-m=30

# ------------------------------------------------------------
# 버스 정보 출처 — region-id 가 고른다
# ------------------------------------------------------------
# 왜 지역별 표가 필요한가: 전국 하나로 되는 API 가 없다. 실제로 호출해서 확인했다.
#   TAGO 도시코드 138건에 서울이 없다(서울은 TOPIS 가 따로 있다).
#   cityCode=11/1100/11010 을 억지로 넣어도 resultCode=00 에 totalCount=0 인 빈 응답이다.
#
# 왜 별도 property 두 줄로 두지 않는가: 'region-id 한 줄만 바꾸면 지역을 갈아탄다'는
#   규칙을 버스도 따라야 한다. 따로 두면 지도는 보은인데 버스는 서울을 부르는 상태가
#   조용히 생기고, 그때 화면은 '정류장이 없다'고만 말한다.
#
# 값 형식: '<제공자>:<도시코드>'
#   tago:33320   apis.data.go.kr — 포털 자기 서버라 승인 즉시 동작한다.
#                도시코드는 getCtyCodeList 로 확인한다(보은군 33320 · 제천시 33030 · 청주시 33010).
#   topis:       ws.bus.go.kr — 서울 전용이라 도시코드가 없다.
#                ★ 2026-08-18 현재 막혀 있다. 포털은 [승인] 인데 서울시 서버가 키를 모른다
#                (headerCd=7, 인증모듈 에러코드 30). 가짜 키와 응답이 한 글자도 다르지 않다.
#                구현체가 아직 없어서 이 값이면 버스 탭이 '준비 중'이라고 답한다.
#
# ★ 키를 반드시 따옴표로 감쌀 것. 이 값은 SpEL 인라인 맵으로 읽는데,
#   따옴표가 없으면 seoul-junggu 를 '변수 seoul 빼기 변수 junggu' 로 해석해
#   기동이 통째로 실패한다(EL1008E: Property or field 'seoul' cannot be found).
#   위 highway-weights 는 키에 하이픈이 없어서 안 감싸도 됐던 것뿐이다.
wheelway.bus-sources={ 'seoul-junggu': 'topis:', 'chungbuk-boeun': 'tago:33320', 'chungbuk-cheongju': 'tago:33010' }

# ------------------------------------------------------------
# 운행 시간표 — 이것도 region-id 가 고른다
# ------------------------------------------------------------
# 왜 필요한가: 도착정보는 '지금 굴러가는 버스'만 잡는다. 보은 저상 5개 노선
#   (330·340·410·610·620)은 전부 최근 도입된 전기버스인데 BIS 단말이 연동되지 않아
#   실시간에 한 번도 잡히지 않는다. 그런데 그 노선이 정확히 휠체어로 탈 수 있는
#   유일한 버스다. 시간표가 없으면 우리 화면은 사용자가 탈 수 있는 차에 대해
#   영원히 아무 말도 못 한다. "다음 340번은 12:55" 는 시간표로만 말할 수 있다.
#
# 값: 클래스패스 경로. 없는 지역은 이 표에서 빼 두면 시간표 없이 조용히 돈다.
#   ★ 키를 반드시 따옴표로 감쌀 것 — bus-sources 와 같은 이유다(하이픈).
#
# 출처: 공공데이터포털 '충청북도 보은군_농어촌버스운행표_20250124' (이용허락 제한 없음).
#   원본 CSV 를 손대지 않고 그대로 둔다 — 다듬은 표를 따로 만들면 갱신이 왔을 때
#   무엇을 어떻게 고쳤는지 아무도 기억하지 못한다. 지저분한 값은 BusTimetable 이 흡수한다.
#   TAGO 첫차·막차와 대조해 일치하는 것을 확인했다(340 09:55,12:55 / 620 13:40,16:40).
#
# ★ 이 표로 알 수 있는 것과 없는 것:
#   알 수 있다  기점·종점 출발 시각, 편도 소요시간(종점출발 − 기점출발)
#   알 수 없다  '이 정류장에 몇 시'. 표는 지역명 기준이고 TAGO 는 정류장 ID 기준이라
#              둘을 잇는 열쇠가 노선번호뿐이다. 화면이 기점 출발을 도착으로 보여주면
#              사용자는 이미 지나간 버스를 기다린다
wheelway.timetable-sources={ 'chungbuk-boeun': 'timetable/boeun-20250124.csv' }

# ------------------------------------------------------------
# 복합 경로 — 걸어서 → 버스 → 걸어서
# ------------------------------------------------------------
# transit-max-walk-m: 정류장까지 걸어갈 수 있다고 볼 최대 거리.
#             넘는 정류장은 후보에서 아예 뺀다. 휠체어로 1.2km 는 도보 20분이 넘어서,
#             그보다 먼 정류장까지 걸어가 버스를 타는 안은 거의 언제나 그냥 걷는 것보다 나쁘다.
#             상한이 없으면 '3km 걸어가서 버스 타기' 같은 안이 목록에 끼어든다.
#             ★ 직선거리로 한 번, 진짜 경로 거리로 한 번 — 두 번 잰다.
#             직선으로 200m 인데 하천 때문에 실제로는 1.5km 인 정류장이 여기서 걸러진다.
# transit-stop-candidates: 출발지·도착지 양쪽에서 정류장 후보를 몇 곳씩 볼지.
#             한 곳씩만 보면 안 된다 — 제일 가까운 두 정류장을 잇는 노선이 없는 일이 흔하고,
#             그때 두 번째로 가까운 것끼리는 한 번에 이어지는 경우가 많다.
#             1 로 두면 '직통이 없다'는 거짓말을 자주 하게 된다.
wheelway.transit-max-walk-m=1200
wheelway.transit-stop-candidates=5

# 시간표도 관측도 없을 때 쓸 버스 주행 속도(km/h). ★ 맨 마지막 차선책이다.
#
# 버스로 몇 분 걸리는지는 세 곳에서 온다. 순서가 있다.
#   ① 시간표    편도 소요시간을 구간 길이 비율로 나눈다      (보은)
#   ② 관측      도착정보의 '몇 정거장 앞 · 몇 초 뒤'로 잰다  (청주)
#   ③ 이 값     둘 다 없을 때만
#
# ②가 되는 이유: 도착정보에 '2 정거장 앞 · 117초 뒤'가 같이 온다. 그 버스가 지금 어디쯤인지는
#   경유 정류장 목록에서 순번을 세면 나오고, 거기서 이 정류장까지 거리는 좌표로 잰다.
#   나누면 그 노선의 실제 표정속도다 — 추가 호출이 0 이고, 지역 평균보다 정확하다.
#
# 19km/h 로 잡은 근거: 정차·신호가 다 들어간 표정속도다. 사람이 생각하는 '버스 속도'보다
#   훨씬 느린 값이라야 맞는다. 이 값으로 낸 시간에는 화면이 '어림한 값'이라고 밝혀 적는다.
wheelway.bus-speed-kmh=19

# 정류장별 경유노선을 몇 분 동안 재사용할지.
# 어느 노선이 어느 정류장에 서는지는 개편이 있을 때나 바뀐다.
# ★ 길게 잡는 데는 이유가 하나 더 있다: 시간표를 붙이면서 경유노선을 '늘' 부르게 됐다.
#   전에는 도착정보가 0건일 때만 불렀는데, 그러면 일반차량 한 대가 오고 있다는 이유로
#   실시간에 안 잡히는 저상 노선의 다음 시각이 화면에서 통째로 사라진다.
wheelway.bus-routes-cache-min=360

# 주변 정류장을 몇 개까지 띄울지. TAGO 근접정류소는 반경이 아니라 개수로 끊는다.
wheelway.bus-nearby-limit=8

# 근접정류소 응답을 몇 분 동안 재사용할지.
# 정류장 위치는 몇 년째 그대로인데, 개발계정은 하루 호출 수가 정해져 있다.
wheelway.bus-stop-cache-min=30

# 도착정보를 몇 초 동안 재사용할지. ★ 위 정류장 캐시와 전혀 다른 물건이다.
#
# 왜 필요한가: 화면이 45초마다 갱신하는데, 같은 정류장을 100명이 보고 있으면
#     45초마다 TAGO 호출이 100번 나간다. 카카오가 이 문제가 없는 이유는
#     중앙에서 한 번 받아 모두에게 뿌리기 때문이다. 여기가 그 자리다.
#
# 왜 12초인가: 원본(버스 단말 → 지자체 센터)이 어차피 30초~1분마다 갱신된다.
#     그보다 짧게 잡으면 같은 값을 다시 받아오는 것뿐이라 잃는 정확도가 사실상 없다.
#     대신 분 단위로 잡으면 안 된다 — '지금 몇 분 뒤'라서 30초만 묵어도 틀린 값이 된다.
#
# ★ 응답을 통째로 담는다. 저상버스만 골라 담지 않는다.
#     TAGO 는 '저상만 달라'를 못 받아서 어차피 전부 오고, 걸러 담으면
#     '전체 4대 중 저상 2대'를 못 말하게 되는 데다 [저상만] 을 끌 때 다시 불러야 한다.
#     거르는 일은 화면이 한다.
#
# 0 이면 캐시를 끈다.
wheelway.bus-board-cache-sec=12

# 이동 속도 — 출발시간 추천에 쓴다
# walk-default-m-per-min: 기록이 모자랄 때 쓸 값. 66.7 = 4km/h 다.
#             이 값은 비장애인 보행 속도라 휠체어 사용자에게 맞지 않는다. 어디까지나 시작점이고,
#             실측이 쌓이면 그 사람의 중앙값으로 갈아탄다.
#             화면(map.js)에도 같은 값이 있었는데 서버가 원본을 갖도록 옮겼다 —
#             두 곳에 두면 한쪽만 고쳐 안내가 갈린다.
# walk-min-records: 개인 값으로 넘어가는 데 필요한 기록 수.
#             한두 건은 그날 컨디션·날씨·신호운이 그대로 들어가 있어 그 사람의 속도라고 할 수 없다.
# walk-min-sec / walk-max-sec: 속도 계산에서 뺄 기록의 경계.
#             너무 짧으면 [출발]·[도착]을 연달아 누른 것이고(속도가 터무니없이 커진다),
#             너무 길면 [도착] 누르는 것을 잊은 것이다(속도가 0 에 가까워진다).
#             둘 다 중앙값을 흔들어서 기계가 먼저 거른다.
wheelway.walk-default-m-per-min=66.7
wheelway.walk-min-records=3
wheelway.walk-min-sec=30
wheelway.walk-max-sec=14400

# block-fallback-max-m: 반경 안에 보도가 없을 때 '가장 가까운 구간'을 찾아볼 최대 거리.
#             공사가 기록돼 있는데 반경이 좁아 아무것도 못 막는 상황을 피하기 위한 차선책이다.
#             막는 길이는 세그먼트 1개(공사 주변은 5m)라 이 값과 무관하고, 이 값은 '얼마나 멀리
#             떨어진 보도까지 끌어다 막을지'만 정한다.
#             15m 로 잡은 근거(중구 60건 실측): 차선책이 필요한 19건의 거리 분포가 5.5~35.5m 인데
#             10m 면 10건이 무효가 되고, 30m 를 넘기면 공사와 무관한 보도를 막을 위험이 커진다.
#             15m 면 15건이 살고 16m 이상 떨어진 4건만 빠지는데, 그 4건은 좌표 자체가 크게
#             잘못된 것이라 자동 보정보다 화면에서 직접 옮기는 편이 맞다
wheelway.block-fallback-max-m=15

# ------------------------------------------------------------
# 도로 종류별 경로 비용 가중치 — cost = LENGTH_M × weight
# ------------------------------------------------------------
# 왜 필요한가: 탐색 대상 엣지 70,624 중 차도 계열이 40,674(58%)다.
# cost 가 길이뿐이면 보도와 차도가 같은 값이라 Dijkstra 가 대로 한복판을 그냥 질러간다.
# 실제로 청계광장→광화문역이 285m 로 나왔는데 카카오 보행 경로는 418m 다.
#
# 왜 하드필터로 차도를 빼지 않는가: OSM 인도 태그 커버리지가 중구 대로 기준 7.1% 라,
# 차도를 지우면 인도가 안 그려진 구간이 통째로 끊긴다. 비싸게만 만들어 연결은 살린다.
#
# ★ 이 값은 '보행자 일반' 이 아니라 '휠체어' 기준이다. 둘은 반대다.
#   - 대로(primary/secondary): 보도가 넓고 턱낮춤이 있어 휠체어에 가장 편하다.
#     중심선 자체는 차도지만, 실제로는 그 길에 딸린 보도를 걷는 것과 같으므로 싸게 둔다.
#   - 골목(residential/service): 좁고 주차 차량·노면 불량에 보도가 아예 없다.
#     부피가 있는 휠체어에는 대로보다 어렵다. 그래서 대로보다 비싸다.
#   처음에 보행자 기준으로 primary=4.0, residential=1.6 을 넣었더니 경로의 절반 이상이
#   골목으로 갔다(시청->명동성당 residential 57.6%). 휠체어에는 그게 더 나쁜 안내다.
#
# 1.0 미만을 주지 말 것 - 나중에 A* 로 바꿀 때 직선거리 휴리스틱이 admissible 하지 않게 된다.
# 값을 바꾸면 그래프를 다시 만들어야 하므로 서버 재기동이 필요하다.
wheelway.highway-weights={ \
  footway:1.0, pedestrian:1.0, path:1.0, living_street:1.3, \
  primary:1.3, primary_link:1.3, \
  secondary:1.4, secondary_link:1.4, \
  tertiary:1.5, tertiary_link:1.5, \
  residential:2.2, unclassified:2.2, service:3.0, \
  connector:1.0, crossing:1.0 }

# 표에 없는 highway 값(새 태그, NULL)에 쓸 값. 보도로 오인하지 않도록 1.0 보다 크게 둔다.
wheelway.highway-weight-default=2.0

# ------------------------------------------------------------
# 보도 연결 보강 — 교차로와 '이미 그려진' 보도를 잇는다
# ------------------------------------------------------------
# 대로 109.5km 중 55.3% 에 평행 보도가 OSM 에 이미 있는데, 도로망과 공유하는 노드가
# 1km 당 3.4개(약 290m 마다)뿐이라 들어갈 문이 없어 탐색이 중심선을 탄다.
# 실제로 경로가 쓴 대로의 66% 가 '보도가 옆에 있는데도 중심선을 쓴' 경우였다.
#
# 보도를 새로 그리지 않는다. 교차로(차수 3 이상)에서만, 사분면마다 가장 가까운 보도 노드
# 하나씩만 잇는다. 중간 지점을 이으면 무단횡단을 모델링하게 되므로 잇지 않는다.
# 0 이면 기능을 끈다. 값을 바꾸면 서버 재기동이 필요하다.
wheelway.sidewalk-connect-max-m=20

# ------------------------------------------------------------
# 수동 엣지 (MANUAL_EDGES) — 사람이 지도에서 직접 넣고 뺀 것
# ------------------------------------------------------------
# EDGE_ID 가 아니라 좌표로 저장되므로 기동할 때마다 다시 찾아야 한다.
# snap : '추가' 의 양 끝을 기존 노드에 붙일 최대 거리
# split: 그 안에 노드가 없을 때 엣지를 쪼개 노드를 만들 최대 거리.
#        보도 한가운데에 횡단보도를 다는 경우가 이것이다. 이게 없으면 노드가 있는 자리에만 이을 수 있다
# match: '삭제' 가 대상 엣지를 찾을 때 허용할 오차. 너무 크면 옆 엣지까지 지운다
wheelway.manual-edge-snap-max-m=6
wheelway.manual-edge-split-max-m=20
wheelway.manual-edge-match-max-m=5

# 비밀값(DB 비밀번호, 카카오·네이버 키) 불러오기.
# src 바깥에 둬서 빌드 산출물에 안 들어가고, .gitignore 에 있어 커밋되지 않는다.
# optional: 이라 파일이 없어도 앱은 뜬다. 채울 항목은 credentials/api_keys.properties.example 참고
spring.config.import=optional:file:credentials/api_keys.properties
